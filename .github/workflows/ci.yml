name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake-generator: "Unix Makefiles"
          - os: windows-latest
            cmake-generator: "Visual Studio 17 2022"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config

      - name: Setup vcpkg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          ./bootstrap-vcpkg.sh

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg dependencies
        run: |
          ./vcpkg/vcpkg install --triplet=${{ runner.os == 'Linux' && 'x64-linux' || 'x64-windows' }}
        shell: bash
        if: runner.os == 'Linux'

      - name: Install vcpkg dependencies (Windows)
        shell: pwsh
        run: |
          .\vcpkg\vcpkg install --triplet=x64-windows
        if: runner.os == 'Windows'

      - name: Configure CMake
        run: |
          cmake -B build \
            -G "${{ matrix.cmake-generator }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release
        shell: bash
        if: runner.os == 'Linux'

      - name: Configure CMake (Windows)
        run: |
          $toolchain = Join-Path -Path ${{ github.workspace }} -ChildPath "vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake -B build `
            -G "${{ matrix.cmake-generator }}" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_BUILD_TYPE=Release
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Build
        run: |
          cmake --build build --config Release --parallel 4
        shell: bash

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --build-config Release
        shell: bash

  quality-checks:
    name: Code Quality & Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang

      - name: Install CMake dependencies
        run: |
          sudo apt-get install -y cmake build-essential pkg-config

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install --triplet=x64-linux

      - name: Configure CMake for linting
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Run clang-tidy on all source files
        run: |
          # Run clang-tidy on all source files; report issues but allow workflow to continue for now
          # To enforce as a gate, set continue-on-error: false or use exit code checking
          find src -name '*.cpp' -type f | xargs clang-tidy -p build --header-filter=".*" || true

      - name: Verify documentation files exist
        run: |
          echo "Checking documentation files..."
          for doc in docs/00_intended_use.md docs/01_plan.md docs/02_SRS.md docs/03_SDS.md docs/04_test_plan.md docs/05_acceptance_tests.md docs/06_traceability.md docs/07_deploy.md docs/08_known_issues.md; do
            if [ -f "$doc" ]; then
              echo "✓ Found $doc"
            else
              echo "✗ Missing $doc"
              exit 1
            fi
          done
          echo "All documentation files present!"

      - name: Validate README
        run: |
          if [ -f "README.md" ]; then
            echo "✓ README.md exists"
            if [ -s "README.md" ]; then
              echo "✓ README.md is not empty"
            else
              echo "✗ README.md is empty"
              exit 1
            fi
          else
            echo "✗ README.md missing"
            exit 1
          fi
