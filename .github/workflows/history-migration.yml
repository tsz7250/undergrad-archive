name: Preserve undergraduate repository histories

on:
  push:
    branches: [main]
    paths: [.github/workflows/history-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Import histories and verify trees
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            1131_Chatbot
            1121_LinearAlgebra
            1122_HDL
            1122_WebsiteProgrammingPractice
            1122_AssemblyLanguage
            1112_ComputerProgramming
            1111_WebProgramming
            1142_AI-assistedSoftwareDevelopment
            1131_Chatbot_Final
            1122_Web_Final
            1111_WebProgramming_Final
            1142_OpenPlatformSoftware_Final
          )
          mkdir -p "$RUNNER_TEMP/source-repos"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c history-migration
          git push origin history-migration
          git branch backup/snapshot-before-history main
          git push origin backup/snapshot-before-history

          # Remove the previously imported snapshots on this migration branch.
          git rm -r --ignore-unmatch "${repos[@]}"
          git commit -m "Prepare archive for original repository histories"

          for repo in "${repos[@]}"; do
            git clone --bare "https://github.com/tsz7250/$repo.git" "$RUNNER_TEMP/source-repos/$repo.git"
            git fetch --no-tags "$RUNNER_TEMP/source-repos/$repo.git" "+refs/heads/*:refs/source/$repo/*"

            while IFS= read -r ref; do
              branch="${ref#refs/source/$repo/}"
              git push origin "$ref:refs/heads/archive/$repo/$branch"
            done < <(git for-each-ref --format='%(refname)' "refs/source/$repo/")

            default_branch="$(git --git-dir="$RUNNER_TEMP/source-repos/$repo.git" symbolic-ref --short HEAD)"
            source_ref="refs/source/$repo/$default_branch"
            git merge --no-commit --no-ff -s ours --allow-unrelated-histories "$source_ref"
            git read-tree --prefix="$repo/" -u "$source_ref"
            git commit -m "Import $repo history under $repo/"

            # Compare every tracked path, blob SHA, and file mode to the source default branch.
            git ls-tree -r -z "$source_ref" > "$RUNNER_TEMP/source.tree"
            git ls-tree -r -z HEAD -- "$repo/" > "$RUNNER_TEMP/archive.tree"
            python3 - "$repo" "$RUNNER_TEMP/source.tree" "$RUNNER_TEMP/archive.tree" <<'PY'
          import sys
          repo, source_path, archive_path = sys.argv[1:]
          def entries(path, prefix=""):
              result = {}
              with open(path, "rb") as f:
                  for row in f.read().split(b"\0"):
                      if not row:
                          continue
                      meta, name = row.split(b"\t", 1)
                      mode, kind, sha = meta.split()
                      if prefix:
                          name = name[len(prefix):]
                      result[name] = (mode, kind, sha)
              return result
          source = entries(source_path)
          archive = entries(archive_path, (repo + "/").encode())
          if source != archive:
              missing = sorted(set(source) - set(archive))[:10]
              extra = sorted(set(archive) - set(source))[:10]
              changed = sorted(k for k in source.keys() & archive.keys() if source[k] != archive[k])[:10]
              raise SystemExit(f"{repo}: tree mismatch; missing={missing}, extra={extra}, changed={changed}")
          print(f"{repo}: verified {len(source)} tracked entries")
          PY
          done

          cat > README.md <<'EOF'
          # Undergrad Archive

          Undergraduate coursework and final-project repositories, consolidated with their original Git histories. Each repository's default branch is stored under its own directory; every source branch tip is preserved under an `archive/<repository>/<branch>` branch.

          | Source repository | Directory |
          | --- | --- |
          | [1131_Chatbot](https://github.com/tsz7250/1131_Chatbot) | `1131_Chatbot/` |
          | [1121_LinearAlgebra](https://github.com/tsz7250/1121_LinearAlgebra) | `1121_LinearAlgebra/` |
          | [1122_HDL](https://github.com/tsz7250/1122_HDL) | `1122_HDL/` |
          | [1122_WebsiteProgrammingPractice](https://github.com/tsz7250/1122_WebsiteProgrammingPractice) | `1122_WebsiteProgrammingPractice/` |
          | [1122_AssemblyLanguage](https://github.com/tsz7250/1122_AssemblyLanguage) | `1122_AssemblyLanguage/` |
          | [1112_ComputerProgramming](https://github.com/tsz7250/1112_ComputerProgramming) | `1112_ComputerProgramming/` |
          | [1111_WebProgramming](https://github.com/tsz7250/1111_WebProgramming) | `1111_WebProgramming/` |
          | [1142_AI-assistedSoftwareDevelopment](https://github.com/tsz7250/1142_AI-assistedSoftwareDevelopment) | `1142_AI-assistedSoftwareDevelopment/` |
          | [1131_Chatbot_Final](https://github.com/tsz7250/1131_Chatbot_Final) | `1131_Chatbot_Final/` |
          | [1122_Web_Final](https://github.com/tsz7250/1122_Web_Final) | `1122_Web_Final/` |
          | [1111_WebProgramming_Final](https://github.com/tsz7250/1111_WebProgramming_Final) | `1111_WebProgramming_Final/` |
          | [1142_OpenPlatformSoftware_Final](https://github.com/tsz7250/1142_OpenPlatformSoftware_Final) | `1142_OpenPlatformSoftware_Final/` |

          ## GitHub Pages

          Static sites are published from these directories:
          - [1131 Chatbot Final](1131_Chatbot_Final/)
          - [1122 Web Final](1122_Web_Final/)
          - [1111 WebProgramming Final](1111_WebProgramming_Final/)

          GitHub Pages serves static files only. Flask APIs, PHP scripts, and other server-side features are not available.
          EOF
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Undergrad Archive</title>
          </head>
          <body>
            <main>
              <h1>Undergrad Archive</h1>
              <ul>
                <li><a href="1131_Chatbot_Final/">1131 Chatbot Final</a></li>
                <li><a href="1122_Web_Final/">1122 Web Final</a></li>
                <li><a href="1111_WebProgramming_Final/">1111 WebProgramming Final</a></li>
              </ul>
              <p>GitHub Pages serves static files only. Flask and PHP features need a server and are unavailable here.</p>
            </main>
          </body>
          </html>
          EOF
          git rm .github/workflows/history-migration.yml
          git add README.md index.html
          git commit -m "Document archived histories and Pages sites"
          git push origin HEAD:refs/heads/history-migration
          # Advance main only after every source tree passes comparison.
          git push origin HEAD:refs/heads/main
