name: Import undergraduate repository snapshots

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-undergrad.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Copy source snapshots
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            1131_Chatbot
            1121_LinearAlgebra
            1122_HDL
            1122_WebsiteProgrammingPractice
            1122_AssemblyLanguage
            1112_ComputerProgramming
            1111_WebProgramming
            1142_AI-assistedSoftwareDevelopment
            1131_Chatbot_Final
            1122_Web_Final
            1111_WebProgramming_Final
            1142_OpenPlatformSoftware_Final
          )
          for repo in "${repos[@]}"; do
            tmp="$(mktemp -d)"
            git clone --depth 1 "https://github.com/tsz7250/${repo}.git" "$tmp/source"
            mkdir -p "$GITHUB_WORKSPACE/${repo}"
            cp -a "$tmp/source/." "$GITHUB_WORKSPACE/${repo}/"
            rm -rf "$GITHUB_WORKSPACE/${repo}/.git" "$tmp"
          done
          rm .github/workflows/import-undergrad.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Archive undergraduate repository snapshots"
          git push
